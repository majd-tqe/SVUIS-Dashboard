name: Deploy dashboard

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DASHBOARD_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/dashboard_deploy"
          chmod 600 "$HOME/.ssh/dashboard_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ secrets.DASHBOARD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DASHBOARD_DEPLOY_USER }}
        run: |
          set -eu
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$release" > dist/__deploy_version
          tar -C dist -czf "$RUNNER_TEMP/dashboard.tar.gz" .
          scp -i "$HOME/.ssh/dashboard_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$RUNNER_TEMP/dashboard.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:/srv/svuis-deploy/incoming/$release.tar.gz"
          ssh -i "$HOME/.ssh/dashboard_deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; mkdir -m 755 /srv/svuis-deploy/releases/$release; tar --no-same-owner --no-same-permissions -xzf /srv/svuis-deploy/incoming/$release.tar.gz -C /srv/svuis-deploy/releases/$release; sudo -n /usr/local/sbin/svuis-dashboard-activate $release"
